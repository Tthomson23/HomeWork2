<!DOCTYPE html>
<html>
    <head> 
        <title>A Simple Scene</title> 
        <script src= 
        "https://aframe.io/releases/1.8.0/aframe.min.js">
         </script>
         </head>
         <body>
          <a-scene>

 
              
                 <a-plane 
                 color="forestgreen"
                  position="0 0 0" 
                  rotation="-90 0 0"
                   width="500" 
                   height="500" > 
                </a-plane> 
                <a-sky 
                color="lightskyblue" > 
            </a-sky>
         <a-mixin
         id="wallcolor"
         color="lightsteelblue">
        </a-mixin>
        <a-box
        mixin="wallcolor"
        position="0 1.5 -16"
        rotation="0 0 0"
        width="10"
        height="3"
        depth="0.1">
    </a-box>
    <a-box
    mixin="wallcolor"
    position="-5 1.5 -11"
    rotation="0 90 0"
    width="10"
    height="3"
    depth="0.1">
</a-box>
<a-box
mixin="wallcolor"
position="5 1.5 -11"
rotation="0 90 0"
width="10"
height="3"
depth="0.1">
</a-box>
<a-box
color="tan"
position="0 0 -11"
width="10"
depth="10"
height="0.1">
</a-box>

</a-box>
<a-sphere
color="orange"
position="1 1 -8"
radius="0.5">
</a-sphere>
<a-text
value="Basketball Court!
"color="black"
position="3 5 -8"
width="20"
>
<a-cylinder
color="black"
position="-1 -5 -5"
rotation="0 0 0"
radius="1"
height="10">
</a-cylinder>
<a-box
color="white"
position="-1 1 -6"
rotation="0 0 0"
width="4"
height="2"
depth="1">
</a-box>
<a-cone
color="white"
position="-1 -1 -3.5"
rotation="180 -60 0"
radius-bottom="0.75"
radius-top="0.50"
height="1.5">
</a-cone>
<a-mixin
id="treetrunk"
color="saddlebrown"
geometry="radius:0.2; height:3">
</a-mixin>
<a-cylinder
mixin="treetrunk"
position="-12 -4 -7">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="-10 -4 -1">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="8 -4 -6">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="4 -4 -2">
</a-cylinder>
<a-mixin
id="conicaltreeleaves"
color="green"
geometry="radius-bottom:1; height:3">
</a-mixin>
<a-cone
mixin="conicaltreeleaves"
position="-12 -2 -7">
</a-cone>
<a-cone
mixin="conicaltreeleaves"
position="4 -2 -2">
</a-cone>
<a-mixin
id="sphericaltreeleaves"
color="green"
geometry="radius:1">
</a-mixin>
<a-sphere
mixin="sphericaltreeleaves"
position="-10 -2 -1">
</a-sphere>
<a-sphere
mixin="sphericaltreeleaves"
position="8 -2 -6">
</a-sphere>





        </a-scene>
    </body>
    </html>
