<!DOCTYPE html>
<html>
    <head> 
        <title>A Simple Scene</title> 
        <script src= 
        "https://aframe.io/releases/1.8.0/aframe.min.js">
         </script>
         </head>
         <body>
          <a-scene>

            <a-assets>
                    <img id="grass-base" src="assets\Grass_005_BaseColor.jpg">
                    <img id="grass-ambient-occlusion" src="assets\Grass_005_AmbientOcclusion.jpg">
                    <img id="grass-normal" src="assets\Grass_005_Normal.jpg">
                    <img id="sphericaltreeleaves-ambient-occlusion" src="assets\Stylized_001_ambientOcclusion.jpg">
                    <img id="sphericaltreeleaves-base" src="assets\Stylized_Leaves_001_basecolor.jpg">
                    <img id="sphericaltreeleaves-normal" src="assets\Stylized_Leaves_001_normal.jpg">
                    <img id="treetrunk-base" src="assets\Bark_005_baseColor.jpg">
                    <img id="treetrunk-ambient-occlusion" src="assets\Bark_005_ambientOcclusion.jpg">
                    <img id="treetrunk-normal" src="assets\Bark_005_normal.jpg">
                    <img id="sky-image" src="assets\sky.jpg">
                    <a-asset-item
                    id="bench"
                    src="assets\bench.glb">
                </a-asset-item>
                </a-assets>
 <a-entity
 gltf-model="#bench"
 position="-2 0 -12"
 rotation="0 90 0"
 scale="5 5 5">
</a-entity>
<a-entity
 gltf-model="#bench"
 position="-4 0 -12"
 rotation="0 90 0"
 scale="5 5 5">
</a-entity>
<a-entity
 gltf-model="#bench"
 position="-4 0 -10"
 rotation="0 90 0"
 scale="5 5 5">
</a-entity>
<a-entity
 gltf-model="#bench"
 position="-4 0 -8"
 rotation="0 90 0"
 scale="5 5 5">
</a-entity>
<a-entity
 gltf-model="#bench"
 position="-2 0 -10"
 rotation="0 90 0"
 scale="5 5 5">
</a-entity>
<a-entity
 gltf-model="#bench"
 position="-2 0 -8"
 rotation="0 90 0"
 scale="5 5 5">
</a-entity>
                <a-plane 
                material= "src: #grass-base;
                 repeat: 500 500;
                  ambientOcclusionMap:#grass-ambient-occlusion;
                   ambientOcclusionTextureRepeat: 500 500;
                    normalMap: #grass-normal; 
                    normalTextureRepeat: 500 500"
                position="0 0 0" 
                rotation="-90 0 0" 
                width="500" height="500" > 
                </a-plane>
                 
                <a-sky
                src="#sky-image">
            </a-sky>
            
         <a-mixin
         id="wallcolor"
         color="lightsteelblue">
        </a-mixin>
        <a-box
        mixin="wallcolor"
        position="0 1.5 -16"
        rotation="0 0 0"
        width="10"
        height="3"
        depth="0.1">
    </a-box>
    <a-box
    mixin="wallcolor"
    position="-5 1.5 -11"
    rotation="0 90 0"
    width="10"
    height="3"
    depth="0.1">
</a-box>
<a-box
mixin="wallcolor"
position="5 1.5 -11"
rotation="0 90 0"
width="10"
height="3"
depth="0.1">
</a-box>
<a-box
color="tan"
position="0 0 -11"
width="10"
depth="10"
height="0.1">
</a-box>

</a-box>
<a-sphere
color="orange"
position="1 1 -8"
radius="0.5">
</a-sphere>
<a-text
value="Basketball Court!
"color="black"
position="3 5 -8"
width="20"
>
<a-cylinder
color="black"
position="-1 -5 -5"
rotation="0 0 0"
radius="1"
height="10">
</a-cylinder>
<a-box
color="white"
position="-1 1 -6"
rotation="0 0 0"
width="4"
height="2"
depth="1">
</a-box>
<a-cone
color="white"
position="-1 -1 -3.5"
rotation="180 -60 0"
radius-bottom="0.75"
radius-top="0.50"
height="1.5">
</a-cone>

<a-cylinder
mixin="treetrunk"
position="-12 -4 -7">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="-10 -4 -1">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="8 -4 -6">
</a-cylinder>
<a-cylinder
mixin="treetrunk"
position="4 -4 -2">
</a-cylinder>
<a-mixin
id="conicaltreeleaves"
geometry="radius-bottom:1; height:3">
</a-mixin>
<a-cone
mixin="conicaltreeleaves"
color="green"
position="-12 -2 -7">
</a-cone>
<a-cone
mixin="conicaltreeleaves"
color="green"
position="4 -2 -2">
</a-cone>
<a-mixin
id="sphericaltreeleaves"
color="green"
geometry="radius:1">
</a-mixin>
<a-sphere
mixin="sphericaltreeleaves"
color="green"
position="-10 -2 -1">
</a-sphere>
<a-sphere
mixin="sphericaltreeleaves"
color="green"
position="8 -2 -6">
</a-sphere>
<a-mixin
id="treetrunk"
material = "src: #treetrunk-base; 
repeat: 3 5; 
ambientOcclusionMap: #treetrunk-ambient-occlusion;
 ambientOcclusionTextureRepeat: 3 5;
  normalMap: #treetrunk-normal;
   normalTextureRepeat: 3 5"
geometry="radius:0.2; height:3">
</a-mixin>

</a-scene>
    </body>
    </html>
